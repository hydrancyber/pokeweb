<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>길을 잃은 세계</title>
<style>
:root{--bg:#14161a;--pn:#1d2026;--ln:#2e323a;--tx:#e8e4d8;--dim:#9aa0a8;--ac:#ff6a3d}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,-apple-system,"Noto Sans KR",sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:360px;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:22px 18px}
h1{font-size:19px;margin:0 0 4px;text-align:center}.sub{color:var(--dim);font-size:12.5px;text-align:center;margin:0 0 16px}
input{width:100%;padding:10px;margin:5px 0;background:#101216;color:var(--tx);border:1px solid var(--ln);border-radius:8px;font-size:16px}
button{width:100%;padding:11px;margin:6px 0 0;border-radius:8px;border:1px solid var(--ln);background:#262a32;color:var(--tx);font-size:15px;cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:#1a0b06;font-weight:700}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{margin:0;padding:8px}.tabs .on{border-color:var(--ac);color:var(--ac)}
.msg{min-height:20px;font-size:13px;color:#ffb199;margin-top:8px;text-align:center}.hide{display:none}
.fine{font-size:11px;color:var(--dim);text-align:center;margin-top:14px;line-height:1.5}
</style></head><body>
<div class="box">
  <h1>길을 잃은 세계의 포켓몬</h1><p class="sub">초대받은 사람만 들어올 수 있어요</p>
  <div id="load" class="hide" style="text-align:center;padding:20px 0">게임을 불러오는 중…</div>
  <div id="form">
    <div class="tabs"><button id="t-in" class="on">로그인</button><button id="t-up">초대코드로 가입</button></div>
    <input id="em" autocomplete="username" autocapitalize="none" placeholder="아이디 (또는 이메일)">
    <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호 (6자 이상)">
    <input id="pw2" type="password" class="hide" autocomplete="new-password" placeholder="비밀번호 확인 (한 번 더)">
    <input id="iv" class="hide" placeholder="초대코드 (예: ASH-1234ABCD)" autocapitalize="characters">
    <button id="go" class="pri">로그인</button>
    <div id="msg" class="msg"></div>
  </div>
  <p class="fine">비공식 개인용 팬 프로젝트입니다. Nintendo / Creatures / GAME FREAK / The Pokémon Company와 무관하며 영리 목적이 없습니다.</p>
</div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)},C=window.PKW_CFG||{},mode='in',busy=false,DOM=C.idDomain||'gmail.com';
function toMail(s){s=String(s||'').trim();return s.indexOf('@')>=0?s:s.toLowerCase()+'@'+DOM}
function msg(t){$('msg').textContent=t||''}
function human(e){var m=String((e&&e.message)||e||'');
  if(m.indexOf('Invalid login')>=0)return'아이디나 비밀번호가 맞지 않아요.';
  if(m.indexOf('Database error saving')>=0||m.indexOf('invite_')>=0)return'초대코드가 올바르지 않거나, 이미 다 쓴 코드예요.';
  if(m.indexOf('already registered')>=0)return'이미 쓰고 있는 아이디예요. 다른 아이디로 해 주세요.';
  if(m.indexOf('at least')>=0||m.indexOf('Password')>=0)return'비밀번호는 6자 이상이어야 해요.';
  if(m.indexOf('Object not found')>=0||m.indexOf('not found')>=0)return'게임 파일이 아직 올라가 있지 않아요. 운영자에게 알려 주세요.';
  return'문제가 생겼어요. 잠시 뒤에 다시 해 주세요.'}
function setMode(m){mode=m;$('t-in').className=m==='in'?'on':'';$('t-up').className=m==='up'?'on':'';$('iv').className=m==='up'?'':'hide';$('pw2').className=m==='up'?'':'hide';$('go').textContent=m==='in'?'로그인':'가입하고 들어가기';msg('')}
$('t-in').onclick=function(){setMode('in')};$('t-up').onclick=function(){setMode('up')};
if(!C.url||!C.key||!window.supabase){msg('서버 설정(config.js)이 비어 있어요.');$('go').disabled=true;return}
var sb=window.supabase.createClient(C.url,C.key,{auth:{persistSession:true,autoRefreshToken:true}});
// 로그인에 성공하면 비공개 저장소에서 게임 본체를 받아 이 페이지를 통째로 교체한다.
async function launch(){
  $('form').className='hide';$('load').className='';
  try{var r=await sb.storage.from('game').download('game.html');if(r.error)throw r.error;
    var html=await r.data.text();document.open();document.write(html);document.close()}
  catch(e){$('load').className='hide';$('form').className='';msg(human(e));try{await sb.auth.signOut()}catch(x){}}}
$('go').onclick=async function(){
  if(busy)return;var em=$('em').value.trim(),pw=$('pw').value,iv=$('iv').value.trim();
  if(!em||pw.length<6)return msg('아이디와 6자 이상의 비밀번호를 넣어 주세요.');
  if(mode==='up'){if(em.indexOf('@')<0&&!/^[a-z0-9._-]{3,20}$/i.test(em))return msg('아이디는 영문·숫자·._- 3~20자로 적어 주세요.');if($('pw2').value!==pw)return msg('비밀번호 확인이 달라요. 같은 비밀번호를 두 번 입력해 주세요.')}
  if(mode==='up'&&!iv)return msg('초대코드를 넣어 주세요.');
  busy=true;msg('');
  try{var r=mode==='in'?await sb.auth.signInWithPassword({email:toMail(em),password:pw}):await sb.auth.signUp({email:toMail(em),password:pw,options:{data:{invite:iv}}});
    if(r.error)throw r.error;
    if(!r.data.session){msg('가입됐어요! 운영자에게 "Confirm email"이 꺼져 있는지 확인해 달라고 하세요.');busy=false;return}
    await launch()}catch(e){msg(human(e))}
  busy=false};
// 이미 로그인된 브라우저라면 바로 들어간다.
sb.auth.getSession().then(function(r){if(r.data&&r.data.session)launch()});
})();
</script></body></html>
